<section class="main">
  <app-input [itemEditar]="itemEditar">
  </app-input>
  <div class="container">
    <div class="lista">
      <h4 class="title-list">Lista de Compras</h4>

      <div *ngFor="let item of listasCompras">
        <app-item [item]="item" (emitirItemEditar)="editarItem($event)"></app-item>
      </div>
    </div>
  </div>
</section>
